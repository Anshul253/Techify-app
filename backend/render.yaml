services:
  - type: web
    name: techify-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./techify.db # Use Postgres URL in production environment variables
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
